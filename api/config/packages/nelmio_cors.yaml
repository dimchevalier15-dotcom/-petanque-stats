nelmio_cors:
    defaults:
        allow_credentials: false
        allow_origin:
            - 'http://localhost:5173'
        allow_headers:
            - 'Content-Type'
            - 'Authorization'
        allow_methods:
            - 'GET'
            - 'POST'
            - 'PUT'
            - 'PATCH'
            - 'DELETE'
            - 'OPTIONS'
        max_age: 3600

    paths:
        '^/api/':
            origin_regex: false

when@prod:
    nelmio_cors:
        defaults:
            allow_origin:
                - 'https://petanque-analytics.com'
                - 'https://www.petanque-analytics.com'
