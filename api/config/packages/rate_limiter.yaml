framework:
    rate_limiter:
        auth_forgot_password_ip:
            policy: sliding_window
            limit: 8
            interval: '15 minutes'
        auth_forgot_password_email:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        auth_resend_verification:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'

when@test:
    framework:
        rate_limiter:
            auth_forgot_password_ip:
                policy: sliding_window
                limit: 1000
                interval: '1 minute'
            auth_forgot_password_email:
                policy: sliding_window
                limit: 1000
                interval: '1 minute'
            auth_resend_verification:
                policy: sliding_window
                limit: 1000
                interval: '1 minute'
