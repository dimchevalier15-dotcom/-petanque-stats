security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~
        main:
            lazy: true
            security: false

    access_control:
        - { path: ^/api/matches, roles: ROLE_USER }
        - { path: ^/api/competitions, roles: ROLE_USER }
        - { path: ^/api/countries, roles: ROLE_USER }
        - { path: ^/api/clubs$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/clubs, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
