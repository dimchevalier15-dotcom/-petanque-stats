version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: petanque_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: petanque
      MYSQL_USER: petanque
      MYSQL_PASSWORD: petanque
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppetanque"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: petanque_api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: "mysql://petanque:petanque@mysql:3306/petanque?serverVersion=8.0&charset=utf8mb4"
      DEFAULT_URI: http://localhost:8080
      FRONTEND_BASE_URL: http://localhost:5173
      MAIL_FROM: noreply@petanque-analytics.com
      MAIL_FROM_NAME: "Pétanque Analytics"
      APP_LATEST_VERSION: "1.4.1"
      APP_MINIMUM_VERSION: "1.0.0"
      APP_ANDROID_STORE_URL: "https://play.google.com/store/apps/details?id=com.petanquestats.app"
    ports:
      - "8080:8000"
    volumes:
      - ./api:/app

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: petanque_mobile
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  mysql_data: